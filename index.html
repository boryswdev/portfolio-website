<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>borys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="explorer-bar" id="explorer-bar">
    <span class="explorer-left">
      <span class="icon">📁</span>
      <span class="explorer-label">main</span>
    </span>
    <button class="collapse-btn" id="collapse-btn" aria-label="collapse folder">▾</button>
  </div>

  <button class="collapsed-folder" id="collapsed-folder" aria-label="open folder">
    <span class="icon icon-lg">📁</span>
    <span>main</span>
  </button>

  <div class="page-content" id="page-content">

    <fieldset class="file-box">
      <legend><span class="icon">📄</span> readme.txt</legend>
      <header>
        <h1 id="heading"><noscript>hi, i'm <span class="highlight">borys</span></noscript></h1>
        <p class="subtitle">// welcome to my portfolio website<br>// use the integrated terminal to interact with my website</p>
      </header>
    </fieldset>

    <div class="terminal" id="terminal">
      <div class="terminal-bar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">bash</div>
      </div>
      <div class="terminal-body" id="terminal-body">
        <div class="prompt-line">
          <span class="prompt">borys@portfolio:~$</span>
          <span class="input-wrap"><span class="typed" id="typed"></span><span class="cursor"></span></span>
        </div>
      </div>
    </div>

    <details class="how-to">
      <summary><span class="icon">📁</span> help</summary>
      <fieldset class="file-box">
        <legend><span class="icon">📄</span> help.txt</legend>
        <p class="help-text">available commands:</p>
        <p class="help-text">pwd — shows your current directory</p>
      </fieldset>
    </details>

  </div>

  <script src="script.js"></script>
</body>
</html>
